[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "web-gateway"
version = "0.1.0"
description = "Local website publishing and shared login behind Caddy"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
web-publish = "web_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
